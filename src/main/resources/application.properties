#   BACKEND
server.port=8080
spring.application.name=bandu-airlines-backend

#   DATABASE - POSTGRESQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bandu_airlines_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#   JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#   ACTUATOR
management.endpoints.web.exposure.include=health

#   SEGURIDAD
# false = todo abierto (desarrollo mientras CUENTA no entregue el JWT). Pasar a true cuando CUENTA termine.
app.security.enabled=${SECURITY_ENABLED:true}

#   CORS (INTEGRA). Lista separada por comas; admite patrones, p. ej. http://localhost:*
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# JWT - MODULO CUENTAS
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORREO ELECTRONICO - MODULO CUENTAS

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# AUTENTICACION Y SEGURIDAD SMTP
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}

# TIMEOUTS SMTP
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# DIRECCION REMITENTE
app.mail.remitente=${MAIL_FROM:no-responder@banduairlines.local}

# RECUPERACION DE CONTRASENA
app.cuenta.recuperacion.expiracion-minutos=10
app.cuenta.recuperacion.url-base=${RECUPERACION_URL_BASE:}

# NIVELES DE FIDELIZACION - MODULO CUENTAS
app.fidelizacion.nivel.plata.millas-minimas=${NIVEL_PLATA_MILLAS_MINIMAS:10000}
app.fidelizacion.nivel.oro.millas-minimas=${NIVEL_ORO_MILLAS_MINIMAS:25000}

# FIDELIZACION - catalogo de beneficios (configuracion, sin tabla).
# Valores de ejemplo para desarrollo: nombres, costos, niveles y stock oficiales pendientes de definir.
# id: positivo, estable y nunca reutilizado. nombre: obligatorio, max 60 caracteres.
# nivel-requerido: BASICO, PLATA u ORO. costo-puntos > 0. stock-inicial >= 0 (unidades totales).
app.fidelizacion.beneficios[0].id=1
app.fidelizacion.beneficios[0].nombre=Equipaje extra
app.fidelizacion.beneficios[0].descripcion=Una maleta adicional de 23 kg
app.fidelizacion.beneficios[0].nivel-requerido=BASICO
app.fidelizacion.beneficios[0].costo-puntos=500
app.fidelizacion.beneficios[0].stock-inicial=100
app.fidelizacion.beneficios[0].habilitado=true
app.fidelizacion.beneficios[1].id=2
app.fidelizacion.beneficios[1].nombre=Asiento preferente
app.fidelizacion.beneficios[1].descripcion=Asiento en las primeras filas
app.fidelizacion.beneficios[1].nivel-requerido=BASICO
app.fidelizacion.beneficios[1].costo-puntos=800
app.fidelizacion.beneficios[1].stock-inicial=50
app.fidelizacion.beneficios[1].habilitado=true
app.fidelizacion.beneficios[2].id=3
app.fidelizacion.beneficios[2].nombre=Upgrade de cabina
app.fidelizacion.beneficios[2].descripcion=Mejora de cabina sujeta a disponibilidad
app.fidelizacion.beneficios[2].nivel-requerido=PLATA
app.fidelizacion.beneficios[2].costo-puntos=3000
app.fidelizacion.beneficios[2].stock-inicial=20
app.fidelizacion.beneficios[2].habilitado=true
app.fidelizacion.beneficios[3].id=4
app.fidelizacion.beneficios[3].nombre=Sala VIP
app.fidelizacion.beneficios[3].descripcion=Acceso a sala VIP en el aeropuerto
app.fidelizacion.beneficios[3].nivel-requerido=ORO
app.fidelizacion.beneficios[3].costo-puntos=2000
app.fidelizacion.beneficios[3].stock-inicial=10
app.fidelizacion.beneficios[3].habilitado=true
app.fidelizacion.beneficios[4].id=5
app.fidelizacion.beneficios[4].nombre=Kit de viaje
app.fidelizacion.beneficios[4].descripcion=Kit de bienvenida a bordo
